<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente CSS</title>
    <style>
        *{
            height: 100%;
        }
        body{ /* configurações globais das css */

            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h2>Testando gradientes</h2>
</body>
</html>
