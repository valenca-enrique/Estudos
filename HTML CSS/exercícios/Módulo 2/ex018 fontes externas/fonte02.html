<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Wondra';
            src: url('Wondra-yYnJ2.otf') format('opentype'), url('fonts/Wondra-yYnJ2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            /*
            Tipos de format()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typography)
            - svg
            */
        }
        body {
            font-family: 'Wondra', Courier, monospace;
        }
        h1 {
            font-family: 'Wondra', Courier, monospace;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Fontes externas baixadas de site</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. At nobis rerum itaque provident, neque dignissimos hic voluptate praesentium quasi earum numquam in illo nemo! Nesciunt rerum exercitationem porro aliquam ratione?
</body>
</html>
